<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#14503f">
<title>Meal Plan</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f3f1ea; --card:#fbfaf6; --ink:#16211d; --ink-soft:#4a544f; --ink-faint:#7d857f;
    --line:#ddd8ca; --pine:#14503f; --pine-soft:#e2ece6; --accent:#2f7d54;
    --bf:#b5761b; --bf-bg:#f6eeda; --ln:#2f7d54; --ln-bg:#e6f0e8; --dn:#3a5ca8; --dn-bg:#e5ebf5;
    --shadow:0 1px 3px rgba(20,33,29,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#10140f; --card:#181d17; --ink:#eef0e9; --ink-soft:#b3b9ac; --ink-faint:#838a7d;
      --line:#2b322a; --pine:#7dc9a6; --pine-soft:#1a2a22; --accent:#6fc192;
      --bf:#d0a24c; --bf-bg:#2a2314; --ln:#6fc192; --ln-bg:#17281d; --dn:#8fa8dd; --dn-bg:#171d2b;
      --shadow:0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:'Inter','Noto Sans Devanagari','Noto Sans Kannada','Noto Sans Telugu',system-ui,sans-serif;
    line-height:1.5; font-size:16px; padding-bottom:40px; -webkit-font-smoothing:antialiased;
    max-width:640px; margin:0 auto; min-height:100vh;
  }
  body.lang-hi, body.lang-kn, body.lang-te { font-family:'Noto Sans Devanagari','Noto Sans Kannada','Noto Sans Telugu','Inter',system-ui,sans-serif; }

  /* header */
  header { position:sticky; top:0; z-index:10; background:var(--paper); padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .toprow { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .brand { font-family:'Fraunces',serif; font-weight:600; font-size:22px; color:var(--pine); }
  .langs { display:flex; gap:4px; }
  .langs button {
    font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); border-radius:8px; padding:6px 9px; cursor:pointer; min-width:38px;
  }
  .langs button.on { background:var(--pine); color:#fff; border-color:var(--pine); }
  @media (prefers-color-scheme: dark){ .langs button.on{ color:#10140f; } }

  /* tabs */
  .tabs { display:flex; gap:6px; margin-top:12px; }
  .tabs button {
    flex:1; font:inherit; font-size:14px; font-weight:600; padding:9px 0; border:none; cursor:pointer;
    background:transparent; color:var(--ink-faint); border-radius:10px; position:relative;
  }
  .tabs button.on { background:var(--pine-soft); color:var(--pine); }

  main { padding:16px 18px; }
  .datehead { font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink-faint); margin-bottom:4px; }
  .dayname { font-family:'Fraunces',serif; font-weight:600; font-size:30px; letter-spacing:-.01em; margin-bottom:18px; }

  /* meal cards */
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    margin-bottom:12px; box-shadow:var(--shadow); border-left:5px solid var(--accent);
  }
  .card.bf { border-left-color:var(--bf); }
  .card.ln { border-left-color:var(--ln); }
  .card.dn { border-left-color:var(--dn); }
  .card .slot { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px; }
  .card.bf .slot { color:var(--bf); }
  .card.ln .slot { color:var(--ln); }
  .card.dn .slot { color:var(--dn); }
  .card .meal { font-size:18px; font-weight:600; line-height:1.4; color:var(--ink); }

  .mini {
    display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .mini .lbl { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--pine); min-width:88px; padding-top:2px; }
  .mini .txt { font-size:14px; color:var(--ink-soft); flex:1; }

  .divider { display:flex; align-items:center; gap:10px; margin:22px 2px 12px; color:var(--ink-faint); font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
  .divider::before,.divider::after { content:""; height:1px; background:var(--line); flex:1; }

  /* week table */
  .wtbl { width:100%; border-collapse:separate; border-spacing:0 8px; font-size:13px; }
  .wtbl th { text-align:left; font-size:11px; color:var(--ink-faint); font-weight:700; padding:0 8px 4px; text-transform:uppercase; letter-spacing:.04em; }
  .wday { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:10px; }
  .wday.today { border-color:var(--pine); border-width:2px; }
  .wday h3 { font-family:'Fraunces',serif; font-weight:600; font-size:16px; padding:11px 14px 6px; color:var(--pine); }
  .wday .row { display:flex; gap:10px; padding:6px 14px; font-size:13.5px; }
  .wday .row:last-child { padding-bottom:12px; }
  .wday .row .k { min-width:74px; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding-top:2px; }
  .wday .row.bf .k { color:var(--bf); } .wday .row.ln .k { color:var(--ln); } .wday .row.dn .k { color:var(--dn); }
  .wday .row.mm .k { color:var(--accent); } .wday .row.mm .v { color:var(--ink-faint); font-size:12.5px; }
  .wday .row .v { color:var(--ink-soft); flex:1; }

  /* grocery */
  .gcat { margin-bottom:16px; }
  .gcat h3 { font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--pine); margin-bottom:8px; }
  .gcat ul { list-style:none; display:flex; flex-wrap:wrap; gap:7px; }
  .gcat li { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13.5px; color:var(--ink-soft); cursor:pointer; -webkit-user-select:none; user-select:none; }
  .gcat li.have { opacity:.45; text-decoration:line-through; }
  .gcat li.need { background:var(--bf-bg); border-color:var(--bf); color:var(--bf); font-weight:600; }
  .ghint { font-size:12px; color:var(--ink-faint); margin-bottom:12px; }
  .gorder { background:var(--card); border:1.5px solid var(--bf); border-radius:12px; padding:12px 14px; margin-bottom:16px; box-shadow:var(--shadow); }
  .gorder h3 { font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--bf); margin-bottom:8px; }
  .gorder ul { list-style:none; display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .gorder li { background:var(--bf-bg); border:1px solid var(--bf); border-radius:20px; padding:5px 12px; font-size:13px; color:var(--bf); font-weight:600; }
  .gbtns { display:flex; gap:8px; }
  .gbtns button { font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); border-radius:8px; padding:7px 12px; cursor:pointer; }
  .gbtns #gcopy { background:var(--pine); border-color:var(--pine); color:#fff; }
  @media (prefers-color-scheme: dark){ .gbtns #gcopy{ color:#10140f; } }

  .meta { text-align:center; font-size:12px; color:var(--ink-faint); margin-top:18px; }
  .hidden { display:none; }
</style>
</head>
<body class="lang-en">

<header>
  <div class="toprow">
    <div class="brand" id="brand">Meal Plan</div>
    <div class="langs" id="langs">
      <button data-l="en" class="on">EN</button>
      <button data-l="hi">हिं</button>
      <button data-l="kn">ಕನ್ನ</button>
      <button data-l="te">తెలు</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="today" class="on">Today</button>
    <button data-t="week">Week</button>
    <button data-t="grocery">Grocery</button>
  </div>
</header>

<main>
  <div id="view-today"></div>
  <div id="view-week" class="hidden"></div>
  <div id="view-grocery" class="hidden"></div>
  <div class="meta" id="meta"></div>
</main>

let DATA = DEFAULT_WEEK;
let lang = "en";
try { lang = localStorage.getItem("mealLang") || "en"; } catch(e){}
let tab = "today";

// Per-week grocery marks: "" (unmarked) -> "have" -> "need". Device-local only.
function gkey(){ return "groceryMarks:" + ((DATA.meta && DATA.meta.generatedFor) || ""); }
function gload(){ try { return JSON.parse(localStorage.getItem(gkey())||"{}"); } catch(e){ return {}; } }
function gsave(s){ try { localStorage.setItem(gkey(), JSON.stringify(s)); } catch(e){} }

function pick(obj){ if(!obj) return ""; if(typeof obj==="string") return obj; return obj[lang] || obj.en || Object.values(obj)[0] || ""; }

function render(){
  const t = T[lang];
  document.body.className = "lang-"+lang;
  document.getElementById("brand").textContent = t.brand;
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  const tb = document.querySelectorAll("#tabs button");
  tb[0].textContent=t.today; tb[1].textContent=t.week; tb[2].textContent=t.grocery;
  tb.forEach(b=>b.classList.toggle("on", b.dataset.t===tab));
  document.getElementById("view-today").classList.toggle("hidden", tab!=="today");
  document.getElementById("view-week").classList.toggle("hidden", tab!=="week");
  document.getElementById("view-grocery").classList.toggle("hidden", tab!=="grocery");

  const now = new Date();
  const dk = DAYKEYS[now.getDay()];
  const day = (DATA.days||{})[dk];
  const f = DATA.fixed||{};

  // TODAY
  const dateStr = now.toLocaleDateString(undefined,{day:"numeric",month:"long"});
  let html = `<div class="datehead">${dateStr}</div><div class="dayname">${t.days[now.getDay()]}</div>`;
  if(day){
    html += mealCard("bf", t.breakfast, pick(day.breakfast));
    html += `<div class="mini"><div class="lbl">${t.midmorning}</div><div class="txt">${pick(day.midmorning || f.midmorning)}</div></div>`;
    html += mealCard("ln", t.lunch, pick(day.lunch));
    html += `<div class="mini"><div class="lbl">${t.evening}</div><div class="txt">${pick(f.evening)}</div></div>`;
    html += mealCard("dn", t.dinner, pick(day.dinner));
    html += `<div class="mini"><div class="lbl">${t.coffee}</div><div class="txt">${pick(f.coffee)}</div></div>`;
  } else {
    html += `<div class="card"><div class="meal">—</div></div>`;
  }
  document.getElementById("view-today").innerHTML = html;

  // WEEK
  let w = "";
  for(let i=1;i<=7;i++){
    const idx=i%7; const key=DAYKEYS[idx]; const d=(DATA.days||{})[key];
    if(!d) continue;
    const isToday = idx===now.getDay();
    w += `<div class="wday ${isToday?"today":""}"><h3>${t.days[idx]}</h3>`+
         `<div class="row bf"><span class="k">${t.breakfast}</span><span class="v">${pick(d.breakfast)}</span></div>`+
         (d.midmorning ? `<div class="row mm"><span class="k">${t.midmorning}</span><span class="v">${pick(d.midmorning)}</span></div>` : "")+
         `<div class="row ln"><span class="k">${t.lunch}</span><span class="v">${pick(d.lunch)}</span></div>`+
         `<div class="row dn"><span class="k">${t.dinner}</span><span class="v">${pick(d.dinner)}</span></div></div>`;
  }
  document.getElementById("view-week").innerHTML = w;

  // GROCERY
  let g = "";
  const groc = DATA.grocery||{};
  const marks = gload();
  const need = [];
  let gbody = "";
  const gcats = Object.keys(groc);
  gcats.forEach((cat,ci)=>{
    gbody += `<div class="gcat"><h3>${cat}</h3><ul>`+groc[cat].map((x,ii)=>{
      const st = marks[cat+"|"+x]||"";
      if(st==="need") need.push(x);
      const mk = st==="have"?"✓ ":st==="need"?"✗ ":"";
      return `<li class="${st}" data-c="${ci}" data-i="${ii}">${mk}${x}</li>`;
    }).join("")+`</ul></div>`;
  });
  if(gcats.length){
    g += `<div class="ghint">${t.ghint}</div>`;
    if(need.length){
      g += `<div class="gorder"><h3>${t.toorder} (${need.length})</h3><ul>`+
           need.map(x=>`<li>${x}</li>`).join("")+`</ul>`+
           `<div class="gbtns"><button id="gcopy">${t.copylist}</button><button id="gclear">${t.clearmarks}</button></div></div>`;
    }
  }
  document.getElementById("view-grocery").innerHTML = g + gbody;

  const meta = DATA.meta || {};
  let metaHtml = [(meta.generatedFor||""), (meta.targets||"")].filter(Boolean).join(" · ");
  if(meta.generatedAt){
    const dt = new Date(meta.generatedAt);
    if(!isNaN(dt)){
      const loc = {en:"en-IN",hi:"hi-IN",kn:"kn-IN",te:"te-IN"}[lang] || "en-IN";
      const stamp = dt.toLocaleString(loc,{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
      metaHtml += (metaHtml?"<br>":"") + t.generated + ": " + stamp;
    }
  }
  document.getElementById("meta").innerHTML = metaHtml;
}

function mealCard(cls,label,text){
  return `<div class="card ${cls}"><div class="slot">${label}</div><div class="meal">${text||"—"}</div></div>`;
}

document.getElementById("langs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; localStorage.setItem("mealLang",lang); render();
});
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; tab=b.dataset.t; render();
});
document.getElementById("view-grocery").addEventListener("click",e=>{
  const t = T[lang];
  const btn = e.target.closest("button");
  if(btn && btn.id==="gclear"){ gsave({}); render(); return; }
  if(btn && btn.id==="gcopy"){
    const marks = gload(); const need = [];
    for(const cat in (DATA.grocery||{})) DATA.grocery[cat].forEach(x=>{ if(marks[cat+"|"+x]==="need") need.push(x); });
    const done = ()=>{ btn.textContent = t.copied; setTimeout(render, 1200); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(need.join("\n")).then(done).catch(()=>{});
    }
    return;
  }
  const li = e.target.closest("li[data-c]"); if(!li) return;
  const cats = Object.keys(DATA.grocery||{});
  const cat = cats[+li.dataset.c]; const item = ((DATA.grocery||{})[cat]||[])[+li.dataset.i];
  if(!item) return;
  const marks = gload(); const k = cat+"|"+item;
  marks[k] = !marks[k] ? "have" : marks[k]==="have" ? "need" : "";
  if(!marks[k]) delete marks[k];
  gsave(marks); render();
});

// Load live week.json if available (GitHub Pages), else keep fallback.
fetch("./week.json",{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(j=>{ DATA=j; render(); })
  .catch(()=>{ render(); });

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
